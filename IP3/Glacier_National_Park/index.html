<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glacier Webcam Analytics</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6fafb;
      color: #10212a;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    .card {
      background: #fff;
      border: 1px solid #d7e2e8;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(16, 33, 42, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }
    p {
      margin: 0 0 20px;
      color: #52626c;
    }
    ul {
      margin: 0;
      padding-left: 20px;
    }
    li {
      margin: 12px 0;
    }
    a {
      color: #0d6b7f;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover {
      text-decoration: underline;
    }
    .note {
      margin-top: 18px;
      font-size: 0.95rem;
      color: #52626c;
    }
    code {
      background: #eef4f7;
      padding: 0.12rem 0.3rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Glacier Webcam Analytics</h1>
      <p>Quick links to the JSON feed files for the Glacier webcam project.</p>
      <ul>
        <li><a href="glacier_apgar_village_feed.json">Apgar Village feed</a></li>
        <li><a href="glacier_west_entrance_feed.json">West Entrance feed</a></li>
        <li><a href="glacier_latest_feed.json">Logan Pass feed</a></li>
      </ul>
      <p class="note">Logan Pass is stored in this repo as <code>glacier_latest_feed.json</code>.</p>
    </section>
  </main>
</body>
</html>
